[project]
name = "sift"
version = "0.2.0"
description = "Search your files by what's in them: on-device, with EmbeddingGemma 2"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1",
  "pillow>=11",
  "pymupdf>=1.26",
  "inotify-simple>=1.3",
  "opencv-python-headless>=5.0.0.93",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
sift = "sift.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Pillow warns between its limit and twice it; Sift refuses those pictures itself (extract.MAX_PIXELS).
filterwarnings = ["ignore::PIL.Image.DecompressionBombWarning"]
